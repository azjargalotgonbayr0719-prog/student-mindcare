<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare - 스트레스 해소 및 솔루션</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .container { background: white; max-width: 450px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #gauge-box { width: 100%; height: 30px; background: #eee; border-radius: 15px; margin: 20px 0; overflow: hidden; }
        #gauge { width: 100%; height: 100%; background: red; transition: all 0.3s; }
        button { padding: 10px 15px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; background: #0070f3; color: white; margin: 5px; }
        .filter-btn { background: #4caf50; }
        #solution-box { margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px; font-weight: bold; min-height: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>MindCare 💖</h2>
        <p>대학생 스트레스 해소 웹앱</p>
        
        <div id="gauge-box"><div id="gauge"></div></div>
        <p>스트레스 지수: <span id="status-text">100%</span></p>
        <button onclick="decreaseStress()">스트레스 볼 터치 🔴</button>
        
        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

        <h3>🎯 현재 나의 상태별 맞춤 처方</h3>
        <div>
            <button class="filter-btn" onclick="filterSolution('학업')">📚 학업 스트레스</button>
            <button class="filter-btn" onclick="filterSolution('휴식')">🛌 만성 피로</button>
            <button class="filter-btn" onclick="filterSolution('멘탈')">🧠 불안/잡생각</button>
        </div>
        <div id="solution-box">상태 버튼을 클릭하면 맞춤 처방전이 나옵니다.</div>
    </div>

    <script>
        let stress = 100;
        function decreaseStress() {
            if(stress > 0) {
                stress -= 5;
                document.getElementById('status-text').innerText = stress + "%";
                let gauge = document.getElementById('gauge');
                gauge.style.width = stress + "%";
                
                if(stress <= 40) gauge.style.background = "green";
                else if(stress <= 70) gauge.style.background = "orange";
            }
        }

        const dummySolutions = [
            { category: '학업', text: "📝 계획을 세우고, 지금 바로 25분 동안 집중한 후 5분간 휴식하세요! (뽀모도로 기법)" },
            { category: '학업', text: "🏫 학교 학생상담센터나 교수님께 도움을 요청하는 것을 두려워하지 마세요." },
            { category: '휴식', text: "🛌 오늘은 스마트폰을 멀리하고 7시간 동안 깊은 잠을 자며 푹 쉬세요." },
            { category: '휴식', text: "🏃‍♂️ 캠퍼스를 15분 동안 가볍게 산책하거나 가벼운 조깅을 해보세요." },
            { category: '멘탈', text: "🧠 심호흡을 5회 크게 하고, '나는 할 수 있어, 괜찮아'라고 자신에게 말해주세요." },
            { category: '멘탈', text: "🎵 좋아하는 잔잔한 음악을 들으며 뇌에 휴식을 주는 시간을 가지세요." }
        ];

        function filterSolution(selectedCategory) {

        }
    </script>
</body>
</html>
